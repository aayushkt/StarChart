<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarChart — editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="panel">
  <header class="panel-head">
    <h1>StarChart</h1>
    <p class="sub">Restyle the plate. Nothing re-renders — the SVG carries its own stylesheet.</p>
  </header>

  <div class="panel-body" id="controls">
    <p class="loading">Loading chart…</p>
  </div>

  <footer class="panel-foot">
    <button id="download" class="btn btn-primary">Download SVG</button>
    <button id="reset-layout" class="btn">Reset layout</button>
    <button id="reset" class="btn">Reset all</button>
  </footer>
</aside>

<main class="stage">
  <div class="stage-bar">
    <p class="hint">Drag a plate or diagram to move it · drag the paper to pan · pinch to zoom</p>
    <p class="dims"><span id="zoom-level">100%</span><span id="dims"></span></p>
  </div>
  <div class="stage-scroll" id="stage-scroll">
    <div class="chart-wrap" id="chart-wrap"></div>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
